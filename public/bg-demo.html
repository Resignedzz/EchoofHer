<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Background Demos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a12;
  color: #e0e0e0;
  font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
  overflow-x: hidden;
}

.demo-section {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.demo-label {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 4px;
  text-transform: uppercase;
  pointer-events: none;
}

.demo-title {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-size: 11px;
  color: rgba(0,255,136,0.6);
  letter-spacing: 2px;
  pointer-events: none;
  white-space: nowrap;
}

/* ===== 1. Particle Grid ===== */
#demo1 canvas { position: absolute; top: 0; left: 0; }

/* ===== 2. Flowing Gradient Blobs ===== */
#demo2 .blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.35;
  animation: blobMove 20s ease-in-out infinite;
}
#demo2 .blob-1 {
  width: 500px; height: 500px;
  background: #00ff88;
  top: -100px; left: -100px;
  animation-delay: 0s;
}
#demo2 .blob-2 {
  width: 400px; height: 400px;
  background: #a855f7;
  bottom: -80px; right: -80px;
  animation-delay: -7s;
  animation-duration: 25s;
}
#demo2 .blob-3 {
  width: 300px; height: 300px;
  background: #00aaff;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation-delay: -14s;
  animation-duration: 30s;
}
@keyframes blobMove {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(100px, -50px) scale(1.1); }
  50% { transform: translate(-80px, 80px) scale(0.9); }
  75% { transform: translate(60px, 40px) scale(1.05); }
}

/* ===== 3. Starfield ===== */
#demo3 canvas { position: absolute; top: 0; left: 0; }

/* ===== 4. Scanline + Noise ===== */
#demo4 canvas { position: absolute; top: 0; left: 0; }
#demo4 .scanlines {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 255, 136, 0.03) 0px,
    rgba(0, 255, 136, 0.03) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  animation: scanScroll 8s linear infinite;
}
@keyframes scanScroll {
  0% { background-position: 0 0; }
  100% { background-position: 0 100vh; }
}

/* ===== 5. Combined: Grid + Blobs ===== */
#demo5 canvas { position: absolute; top: 0; left: 0; }
#demo5 .blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.15;
  pointer-events: none;
}
#demo5 .blob-1 {
  width: 600px; height: 600px;
  background: #00ff88;
  top: -150px; right: -100px;
  animation: blobDrift1 25s ease-in-out infinite;
}
#demo5 .blob-2 {
  width: 500px; height: 500px;
  background: #a855f7;
  bottom: -150px; left: -100px;
  animation: blobDrift2 30s ease-in-out infinite;
}
@keyframes blobDrift1 {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(-120px, 80px); }
  66% { transform: translate(60px, -60px); }
}
@keyframes blobDrift2 {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(100px, -60px); }
  66% { transform: translate(-80px, 100px); }
}
</style>
</head>
<body>

<!-- 1. Particle Grid -->
<section class="demo-section" id="demo1">
  <div class="demo-label">01 / Particle Grid</div>
  <canvas id="c1"></canvas>
  <div class="demo-title">粒子网格 · 鼠标交互</div>
</section>

<!-- 2. Flowing Blobs -->
<section class="demo-section" id="demo2">
  <div class="demo-label">02 / Gradient Blobs</div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="demo-title">渐变光晕 · 流动</div>
</section>

<!-- 3. Starfield -->
<section class="demo-section" id="demo3">
  <div class="demo-label">03 / Starfield</div>
  <canvas id="c3"></canvas>
  <div class="demo-title">星空 · 绿色星尘</div>
</section>

<!-- 4. Scanline + Particle -->
<section class="demo-section" id="demo4">
  <div class="demo-label">04 / Scanline + Noise</div>
  <canvas id="c4"></canvas>
  <div class="scanlines"></div>
  <div class="demo-title">扫描线 · 终端感</div>
</section>

<!-- 5. Combined -->
<section class="demo-section" id="demo5">
  <div class="demo-label">05 / Grid + Blobs</div>
  <canvas id="c5"></canvas>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="demo-title">组合 · 推荐</div>
</section>

<script>
// ==================== 1. Particle Grid ====================
(function() {
  const canvas = document.getElementById('c1');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [], mouse = { x: -999, y: -999 };
  const COUNT = 120, MAX_DIST = 120;

  function resize() {
    const sec = document.getElementById('demo1');
    w = canvas.width = sec.offsetWidth;
    h = canvas.height = sec.offsetHeight;
  }

  function init() {
    resize();
    particles = [];
    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.5 + 0.5
      });
    }
  }

  document.getElementById('demo1').addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  document.getElementById('demo1').addEventListener('mouseleave', () => {
    mouse.x = -999; mouse.y = -999;
  });

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      // Mouse repel
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150 && dist > 0) {
        const force = (150 - dist) / 150 * 0.8;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      }
      p.vx *= 0.98; p.vy *= 0.98;
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 255, 136, 0.6)';
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const d = Math.sqrt((p.x - p2.x) ** 2 + (p.y - p2.y) ** 2);
        if (d < MAX_DIST) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(0, 255, 136, ${(1 - d / MAX_DIST) * 0.15})`;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  init();
  draw();
  window.addEventListener('resize', init);
})();

// ==================== 3. Starfield ====================
(function() {
  const canvas = document.getElementById('c3');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [];

  function resize() {
    const sec = document.getElementById('demo3');
    w = canvas.width = sec.offsetWidth;
    h = canvas.height = sec.offsetHeight;
  }

  function init() {
    resize();
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.2 + 0.3,
        speed: Math.random() * 0.3 + 0.05,
        alpha: Math.random() * 0.8 + 0.2,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }

  let t = 0;
  function draw() {
    ctx.fillStyle = 'rgba(10, 10, 18, 0.15)';
    ctx.fillRect(0, 0, w, h);
    t += 0.01;

    for (const s of stars) {
      const alpha = s.alpha * (0.5 + 0.5 * Math.sin(t * 2 + s.pulse));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 255, 136, ${alpha})`;
      ctx.fill();

      // Glow for bigger stars
      if (s.r > 1) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 255, 136, ${alpha * 0.1})`;
        ctx.fill();
      }

      s.y += s.speed;
      if (s.y > h + 5) { s.y = -5; s.x = Math.random() * w; }
    }
    requestAnimationFrame(draw);
  }

  init();
  draw();
  window.addEventListener('resize', init);
})();

// ==================== 4. Scanline + Floating Particles ====================
(function() {
  const canvas = document.getElementById('c4');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];
  let t = 0;

  function resize() {
    const sec = document.getElementById('demo4');
    w = canvas.width = sec.offsetWidth;
    h = canvas.height = sec.offsetHeight;
  }

  function init() {
    resize();
    particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.5,
        speedX: (Math.random() - 0.5) * 0.2,
        speedY: -Math.random() * 0.5 - 0.1,
        alpha: Math.random() * 0.4 + 0.1
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    t += 0.005;

    // Horizontal scan beam
    const beamY = (t * 100) % h;
    const grad = ctx.createLinearGradient(0, beamY - 30, 0, beamY + 30);
    grad.addColorStop(0, 'rgba(0, 255, 136, 0)');
    grad.addColorStop(0.5, 'rgba(0, 255, 136, 0.04)');
    grad.addColorStop(1, 'rgba(0, 255, 136, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, beamY - 30, w, 60);

    // Particles
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 255, 136, ${p.alpha})`;
      ctx.fill();

      p.x += p.speedX;
      p.y += p.speedY;
      if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
      if (p.x < -5) p.x = w + 5;
      if (p.x > w + 5) p.x = -5;
    }

    // Occasional glitch lines
    if (Math.random() < 0.005) {
      const gy = Math.random() * h;
      ctx.fillStyle = 'rgba(0, 255, 136, 0.08)';
      ctx.fillRect(0, gy, w, 1 + Math.random() * 2);
    }

    requestAnimationFrame(draw);
  }

  init();
  draw();
  window.addEventListener('resize', init);
})();

// ==================== 5. Combined Grid + Blobs ====================
(function() {
  const canvas = document.getElementById('c5');
  const ctx = canvas.getContext('2d');
  let w, h, points = [], mouse = { x: -999, y: -999 };

  function resize() {
    const sec = document.getElementById('demo5');
    w = canvas.width = sec.offsetWidth;
    h = canvas.height = sec.offsetHeight;
  }

  function init() {
    resize();
    points = [];
    // Grid pattern
    const spacing = 50;
    for (let x = 0; x < w + spacing; x += spacing) {
      for (let y = 0; y < h + spacing; y += spacing) {
        points.push({
          ox: x, oy: y, x: x, y: y,
          vx: 0, vy: 0
        });
      }
    }
  }

  document.getElementById('demo5').addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  document.getElementById('demo5').addEventListener('mouseleave', () => {
    mouse.x = -999; mouse.y = -999;
  });

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, w, h);
    t += 0.002;

    for (const p of points) {
      // Mouse interaction
      const dx = p.ox - mouse.x, dy = p.oy - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 180 && dist > 0) {
        const force = (180 - dist) / 180;
        p.vx += (dx / dist) * force * 0.5;
        p.vy += (dy / dist) * force * 0.5;
      }

      // Subtle wave
      p.x = p.ox + Math.sin(t + p.ox * 0.01) * 3 + p.vx;
      p.y = p.oy + Math.cos(t + p.oy * 0.01) * 3 + p.vy;

      p.vx *= 0.92; p.vy *= 0.92;
    }

    // Draw grid lines
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.04)';
    ctx.lineWidth = 0.5;
    const spacing = 50;
    const cols = Math.ceil(w / spacing) + 1;
    const rows = Math.ceil(h / spacing) + 1;

    // Horizontal
    for (let r = 0; r < rows; r++) {
      ctx.beginPath();
      for (let c = 0; c < cols; c++) {
        const p = points[r * cols + c];
        if (!p) continue;
        if (c === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    // Vertical
    for (let c = 0; c < cols; c++) {
      ctx.beginPath();
      for (let r = 0; r < rows; r++) {
        const p = points[r * cols + c];
        if (!p) continue;
        if (r === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    // Draw dots at intersections
    for (const p of points) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const brightness = dist < 180 ? 0.3 + 0.7 * (1 - dist / 180) : 0.15;

      ctx.beginPath();
      ctx.arc(p.x, p.y, dist < 180 ? 1.5 : 1, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 255, 136, ${brightness})`;
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  init();
  draw();
  window.addEventListener('resize', init);
})();
</script>
</body>
</html>
